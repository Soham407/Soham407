    </g>

    <g transform="translate(0 204)">
      <rect width="436" height="44" rx="10" fill="#121C2E" stroke="#1E2C44"/>
      <circle cx="22" cy="22" r="4" fill="#4ADE80"/>
      <text x="42" y="21" font-size="16" font-weight="600" fill="#E6EDF6">studio-kickstart</text>
      <text x="42" y="37" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
