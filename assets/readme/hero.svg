<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="t d">
  <title id="t">Soham Bhutkar — Full Stack Developer</title>
  <desc id="d">Name, role and location beside a list of four shipped products: VC Scanner, SOLVESXX, studio-kickstart and Orvion IntelliAct.</desc>

  <rect width="1200" height="340" rx="24" fill="#0B1120"/>
  <rect x="0" y="0" width="6" height="340" rx="3" fill="#3D8BFD"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" letter-spacing="2.4" fill="#7D8BA1">FULL STACK DEVELOPER · PUNE, INDIA</text>

    <text x="64" y="152" font-size="56" font-weight="700" fill="#E6EDF6">Soham Bhutkar</text>

    <text x="64" y="200" font-size="19" fill="#A9B6C8">I build scalable SaaS platforms on React and Supabase —</text>
    <text x="64" y="228" font-size="19" fill="#A9B6C8">from on-device OCR pipelines to enterprise facility ops.</text>

    <text x="64" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" fill="#5F6D82">MSc Computer Science · in progress</text>
  </g>

  <g id="shipped" transform="translate(700 0)"
