    <text x="0" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" letter-spacing="3" fill="#5F6D82">SHIPPED</text>

    <g transform="translate(0 100)">
      <rect width="436" height="44" rx="10" fill="#121C2E" stroke="#1E2C44"/>
      <circle cx="22" cy="22" r="4" fill="#4ADE80"/>
      <text x="42" y="21" font-size="16" font-weight="600" fill="#E6EDF6">FlipFlow</text>
      <text x="42" y="37" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11.5" fill="#7D8BA1">PDF → interactive 3D flipbooks · React · Supabase · R2</text>
    </g>

    <g transform="translate(0 152)">
      <rect width="436" height="44" rx="10" fill="#121C2E" stroke="#1E2C44"/>
      <circle cx="22" cy="22" r="4" fill="#4ADE80"/>
      <text x="42" y="21" font-size="16" font-weight="600" fill="#E6EDF6">MR Tracking</text>
      <text x="42" y="37" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11.5" fill="#7D8BA1">field-force geolocation + analytics · React · Supabase</text>
    </g>

    <g transform="translate(0 204)">
      <rect width="436" height="44" rx="10" fill="#121C2E" stroke="#1E2C44"/>
      <circle cx="22" cy="22" r="4" fill="#4ADE80"/>
      <text x="42" y="21" font-size="16" font-weight="600" fill="#E6EDF6">SQL Quest</text>
      <text x="42" y="37" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11.5" fill="#7D8BA1">in-browser SQL sandbox · Vite · sql.js · Monaco</text>
    </g>

    <g transform="translate(0 256)">
      <rect width="436" height="44" rx="10" fill="#121C2E" stroke="#1E2C44"/>
      <circle cx="22" cy="22" r="4" fill="#4ADE80"/>
      <text x="42" y="21" font-size="16" font-weight="600" fill="#E6EDF6">Pure Elements</text>
      <text x="42" y="37" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11.5" fill="#7D8BA1">ayurvedic e-commerce + admin · React 19 · TypeScript</text>
    </g>
  </g>
